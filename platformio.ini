[env:tft-c3-mini-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Compile the TFT application with the ESP32-C3-MINI-1 display profile.
build_src_filter =
    -<*>
    +<tft/GymioTftDisplay.cpp>

lib_deps =
    lovyan03/LovyanGFX@^1.2.26

[env:esp32-s3-n8r8]
platform = espressif32
board = gymio_esp32s3_n8r8
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_src_filter =
    +<*>
    -<tft/*>
    -<finish/*>
    -<diagnostics/*>

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    https://github.com/adafruit/Adafruit_VL53L1X.git

[env:finish-gate-s3-mini]
platform = espressif32
board = gymio_esp32s3_mini_n4r2
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_src_filter =
    -<*>
    +<finish/FinishGate.cpp>
    +<gate/GateDetector.cpp>

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    https://github.com/adafruit/Adafruit_VL53L1X.git
