[env:tft-hardware-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Compile only the standalone TFT test. No Gymio application source is linked.
build_src_filter =
    -<*>
    +<diagnostics/C3St7796TftTest.cpp>

lib_deps =
    lovyan03/LovyanGFX@^1.2.26

[env:esp32-s3]
platform = espressif32
board = gymio_esp32s3_n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DGYMIO_TARGET_ESP32_S3

build_src_filter =
    +<*>
    -<diagnostics/C3St7796TftTest.cpp>

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    https://github.com/adafruit/Adafruit_VL53L1X.git

[env:esp32-s3-n8r8]
platform = espressif32
board = gymio_esp32s3_n8r8
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DGYMIO_TARGET_ESP32_S3

build_src_filter =
    +<*>
    -<diagnostics/C3St7796TftTest.cpp>

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    https://github.com/adafruit/Adafruit_VL53L1X.git
