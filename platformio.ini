[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework =arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DGYMIO_TARGET_ESP32_C3

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    https://github.com/adafruit/Adafruit_VL53L1X.git

